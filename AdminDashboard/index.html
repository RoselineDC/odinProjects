<!doctype html>
<html>
  <head>
    <title>Dashboard Lavish Ore</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body>
    <header>
      <section>
        <div class="mainDiv">
          <div class="sidediv">
            <h2>Dashboard</h2>
          </div>

          <div class="middleDiv">
            <div class="upperNav">
              <div class="formDiv">
                <form action="/search" method="GET" aria-label="Site Search">
                  <button type="submit" class="buttonLength">
                    <i class="bi bi-search"></i>
                  </button>

                  <input
                    class="search-input"
                    type="text"
                    name="q"
                    id="q"
                    placeholder="Search..."
                  />
                </form>
              </div>

              <div class="left-div">
                <button class="buttonLength">
                  <i class="bi bi-bell"></i>
                </button>

                <i class="bi bi-person"></i>

                <p>Roseline D</p>
              </div>
            </div>

            <div class="secondNav">
              <div class="profileInfo">
                <i class="bi bi-person"></i>
                <p>Roseline D</p>
              </div>

              <div class="actionButtons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
              </div>
            </div>
          </div>

          <div class="rightDiv">
            <!-- grid -->
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
